name: configops-dev

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: configops
      MARIADB_PASSWORD: configops
      MARIADB_ROOT_PASSWORD: configops-root
    ports:
      - "127.0.0.1:${CONFIGOPS_DB_PORT:-3307}:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${CONFIGOPS_MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${CONFIGOPS_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  wordpress:
    build:
      context: .
      dockerfile: .dev/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: configops
      WORDPRESS_DB_PASSWORD: configops
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('SAVEQUERIES', true);
        define('WP_DISABLE_FATAL_ERROR_HANDLER', true);
        define('FS_METHOD', 'direct');
      XDEBUG_MODE: "${XDEBUG_MODE:-develop,debug}"
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003 idekey=CONFIGOPS"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CONFIGOPS_WP_PORT:-8888}:80"
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/configops
      - ./tests/fixtures/configops-hostile-fixture:/var/www/html/wp-content/plugins/configops-hostile-fixture
    restart: unless-stopped

volumes:
  database_data:
  wordpress_data:
