name: WordPress.org release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate against main (manual runs are always dry runs)
        required: true
        default: 0.7.0
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: wordpress-org-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact release payload
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Show ConfigOps pipeline mark
        run: bash build/ci-banner.sh

      - name: Validate release identity
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^define('CONFIGOPS_VERSION', '\([^']*\)');$/\1/p" configops.php)"
          if [[ -z "$version" ]]; then
            echo "Could not read CONFIGOPS_VERSION." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ "$IS_PRERELEASE" == "true" || "$RELEASE_TAG" != "v$version" ]]; then
              echo "A stable release tag must equal v$version." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" != "refs/heads/main" || "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Dry runs must target main and version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require successful ConfigOps CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" \
            --jq '.total_count')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "ConfigOps CI has not passed for $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked tooling
        run: npm ci

      - name: Build and validate plugin archive
        run: npm run build:plugin

      - name: Verify reproducible archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          first_sha="$(sha256sum "dist/configops-$VERSION.zip" | cut -d ' ' -f 1)"
          npm run build:plugin
          second_sha="$(sha256sum "dist/configops-$VERSION.zip" | cut -d ' ' -f 1)"
          if [[ "$first_sha" != "$second_sha" ]]; then
            echo "Release archive is not reproducible." >&2
            exit 1
          fi
          printf '%s  %s\n' "$second_sha" "configops-$VERSION.zip" > "dist/configops-$VERSION.zip.sha256"
          mkdir -p .wporg-build
          unzip -q "dist/configops-$VERSION.zip" -d .wporg-build

      - name: Preserve exact payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: wordpress-org-${{ steps.version.outputs.version }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .wporg-build/configops
            .wordpress-org
            dist/configops-${{ steps.version.outputs.version }}.zip
            dist/configops-${{ steps.version.outputs.version }}.zip.sha256

  dry-run:
    name: Validate WordPress.org SVN payload
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out action workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Show ConfigOps pipeline mark
        run: bash build/ci-banner.sh

      - name: Restore exact payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wordpress-org-${{ needs.prepare.outputs.version }}
          path: .

      - name: Dry-run WordPress.org deployment
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: true
        env:
          # The pinned action currently checks for non-empty credentials before
          # branching into dry-run mode. Invalid fixed values keep this job
          # credential-free and still make an accidental commit impossible.
          SVN_USERNAME: configops-dry-run
          SVN_PASSWORD: invalid-dry-run-credential
          SLUG: configops
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_DIR: ${{ github.workspace }}/.wporg-build/configops
          ASSETS_DIR: .wordpress-org

  deploy:
    name: Deploy published release
    if: github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/configops/
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Show ConfigOps pipeline mark
        run: bash build/ci-banner.sh

      - name: Restore exact payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wordpress-org-${{ needs.prepare.outputs.version }}
          path: .

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: configops
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_DIR: ${{ github.workspace }}/.wporg-build/configops
          ASSETS_DIR: .wordpress-org

      - name: Attach verified archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/configops-$VERSION.zip" \
            "dist/configops-$VERSION.zip.sha256" \
            --clobber
