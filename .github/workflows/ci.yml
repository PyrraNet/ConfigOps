name: ConfigOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation build and link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked documentation tooling
        run: npm ci

      - name: Reject high-impact tooling vulnerabilities
        run: npm audit --audit-level=high

      - name: Install the documentation browser
        run: npx playwright install --with-deps chromium

      - name: Build and exercise every documentation route
        env:
          DOCS_BASE: /ConfigOps/
        run: npm run test:docs

  release-compliance:
    name: WordPress.org release compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Build the exact release archive
        run: |
          npm ci
          npm run build:plugin
          version="$(node -p "require('./package.json').version")"
          archive="dist/configops-$version.zip"
          first_checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          rm -f "$archive"
          npm run build:plugin
          second_checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          test "$first_checksum" = "$second_checksum"
          mkdir -p .release-check
          unzip -q "dist/configops-$version.zip" -d .release-check

      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: ./.release-check/configops
          strict: true
          # The action currently treats every value except "trunk" as latest.
          # Trunk avoids release-mirror races; the matrix below still covers WordPress 7.0 and latest.
          wp-version: trunk

      - name: Create release checksum
        run: |
          version="$(node -p "require('./package.json').version")"
          cd dist
          sha256sum "configops-$version.zip" > "configops-$version.zip.sha256"

      - name: Keep the checked release archive
        uses: actions/upload-artifact@v7
        with:
          name: configops-release
          path: |
            dist/configops-*.zip
            dist/configops-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: Coverage (70% production / 75% trust boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked build tooling
        run: npm ci

      - name: Enforce coverage against isolated WordPress and MariaDB
        run: npm run test:coverage

      - name: Keep machine-readable coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: configops-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  static-analysis:
    name: PHP 8.2–8.5 compatibility and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none

      - name: Install locked static-analysis tooling
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject known dependency vulnerabilities
        run: composer audit --locked

      - name: Reject an end-of-life minimum PHP runtime
        run: npm run check:runtime-policy

      - name: Scan every PHP source for runtime incompatibilities
        run: composer lint:compatibility

  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            wordpress: "7.0"
          - php: "8.3"
            wordpress: "7.0"
          - php: "8.4"
            wordpress: "latest"
          - php: "8.5"
            wordpress: "latest"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install test tooling
        run: npm ci && npm audit --audit-level=high

      - name: Build performance-budgeted React islands
        run: npm run build:ui && npm run check:ui-budget

      - name: Parse PHP sources
        run: >-
          node_modules/.bin/wp-playground-cli php
          --php=${{ matrix.php }}
          --wp=${{ matrix.wordpress }}
          --mount=.:/wordpress/wp-content/plugins/configops
          -- /wordpress/wp-content/plugins/configops/tests/lint.php

      - name: Run unit checks
        run: >-
          node_modules/.bin/wp-playground-cli php
          --php=${{ matrix.php }}
          --wp=${{ matrix.wordpress }}
          --mount=.:/wordpress/wp-content/plugins/configops
          -- /wordpress/wp-content/plugins/configops/tests/run.php

      - name: Run hostile-input checks
        run: >-
          node_modules/.bin/wp-playground-cli php
          --php=${{ matrix.php }}
          --wp=${{ matrix.wordpress }}
          --mount=.:/wordpress/wp-content/plugins/configops
          -- /wordpress/wp-content/plugins/configops/tests/adversarial.php

      - name: Run WordPress integration checks
        run: >-
          node_modules/.bin/wp-playground-cli php
          --php=${{ matrix.php }}
          --wp=${{ matrix.wordpress }}
          --mount=.:/wordpress/wp-content/plugins/configops
          --mount=tests/fixtures/configops-hostile-fixture:/wordpress/wp-content/plugins/configops-hostile-fixture
          -- /wordpress/wp-content/plugins/configops/tests/integration.php

  adapters:
    name: Real plugin contracts and user flows / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.5"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Test exact WP Mail SMTP and Yoast releases
        run: >-
          node_modules/.bin/wp-playground-cli php
          --php=${{ matrix.php }}
          --wp=latest
          --blueprint=tests/adapters.blueprint.json
          --mount=.:/wordpress/wp-content/plugins/configops
          -- /wordpress/wp-content/plugins/configops/tests/adapters-integration.php

      - name: Build React islands for browser flow
        run: npm run build:ui && npm run check:ui-budget

      - name: Test both real settings screens as a user
        env:
          CONFIGOPS_CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx wp-playground-cli server \
            --php=${{ matrix.php }} \
            --wp=latest \
            --port=9401 \
            --workers=6 \
            --blueprint=tests/adapters.blueprint.json \
            --mount="$GITHUB_WORKSPACE:/wordpress/wp-content/plugins/configops" \
            --mount="$GITHUB_WORKSPACE/tests/fixtures/configops-playground-loader.php:/wordpress/wp-content/mu-plugins/configops-playground-loader.php" \
            --login > /tmp/configops-adapter-ui.log 2>&1 &
          playground_pid=$!
          trap 'kill "$playground_pid" 2>/dev/null || true' EXIT
          bash tests/wait-for-http.sh \
            http://127.0.0.1:9401/wp-login.php \
            /tmp/configops-adapter-ui.log \
            npm run test:adapter-ui

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: adapter-user-flow-php-${{ matrix.php }}-evidence
          path: |
            artifacts/adapter-user-flows/
            /tmp/configops-adapter-ui.log

  native-database:
    name: Native ${{ matrix.name }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            image: mysql:8.4.10
            php: "8.2"
          - name: MariaDB 11.4
            image: mariadb:11.4.12
            php: "8.5"

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: configops
          MYSQL_USER: configops
          MYSQL_PASSWORD: configops
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: configops
          MARIADB_USER: configops
          MARIADB_PASSWORD: configops
        ports:
          - 3306:3306

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP with the native MySQL driver
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install and build ConfigOps
        run: npm ci && npm run build:plugin && npm run check:ui-budget

      - name: Install WordPress and exact supported plugins
        env:
          CONFIGOPS_NATIVE_WP_ROOT: ${{ runner.temp }}/configops-native-wordpress
          CONFIGOPS_REPOSITORY_ROOT: ${{ github.workspace }}
        run: bash tests/setup-native-wordpress.sh

      - name: Run ConfigOps integration checks on the native database
        env:
          CONFIGOPS_WP_ROOT: ${{ runner.temp }}/configops-native-wordpress
        run: php tests/integration.php

      - name: Test both real settings screens on the native database
        env:
          CONFIGOPS_CHROME_PATH: /usr/bin/google-chrome
          CONFIGOPS_TEST_URL: http://127.0.0.1:9402
        run: |
          PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:9402 -t "${{ runner.temp }}/configops-native-wordpress" > /tmp/configops-native-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          bash tests/wait-for-http.sh \
            http://127.0.0.1:9402/wp-login.php \
            /tmp/configops-native-server.log \
            npm run test:adapter-ui

      - name: Run exact adapter contracts on the native database
        env:
          CONFIGOPS_WP_ROOT: ${{ runner.temp }}/configops-native-wordpress
        run: php tests/adapters-integration.php

      - name: Upload native browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}-evidence
          path: |
            artifacts/adapter-user-flows/
            /tmp/configops-native-server.log
