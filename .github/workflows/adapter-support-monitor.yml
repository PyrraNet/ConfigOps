name: Adapter version monitor

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-org-versions:
    name: Detect unsupported active plugin lines
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show ConfigOps pipeline mark
        run: bash build/ci-banner.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Compare contracts with live WordPress.org usage
        run: npm run check:adapter-support
