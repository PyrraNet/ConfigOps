name: Publish ConfigOps documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".wordpress-org/screenshot-1.png"
      - "assets/brand/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show ConfigOps pipeline mark
        run: bash build/ci-banner.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked tooling
        run: npm ci

      - name: Reject high-impact tooling vulnerabilities
        run: npm audit --audit-level=high

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build documentation
        run: npm run docs:build
        env:
          DOCS_BASE: /docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: https://configops.pyrra.net/docs/
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
