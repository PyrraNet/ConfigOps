name: Validate ConfigOps documentation source

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".wordpress-org/screenshot-1.png"
      - "assets/brand/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      verify_public:
        description: Verify that the Vercel-hosted public docs match this release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docs-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show ConfigOps pipeline mark
        run: bash build/ci-banner.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked tooling
        run: npm ci

      - name: Reject high-impact tooling vulnerabilities
        run: npm audit --audit-level=high

      - name: Build and exercise every documentation route
        run: npm run test:docs
        env:
          DOCS_BASE: /docs/
          CONFIGOPS_CHROME_PATH: /usr/bin/google-chrome

  public-sync:
    name: Verify Vercel-hosted documentation
    if: ${{ inputs.verify_public }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify public version and release page
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          docs_html="$(curl --fail --silent --show-error --retry 3 https://configops.pyrra.net/docs/)"
          release_html="$(curl --fail --silent --show-error --retry 3 "https://configops.pyrra.net/docs/releases/$version")"
          grep -Fq "Documentation · $version" <<<"$docs_html"
          grep -Fq "ConfigOps $version" <<<"$release_html"
